<!DOCTYPE html>

<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ความทรงจำของเรา</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;
    }


    /* =====================================================
       BODY
    ===================================================== */

    body {

      font-family:
        "Prompt",
        sans-serif;

      background:
        url("bg.png")
        center center /
        cover
        no-repeat;

      display: flex;

      justify-content: center;
      align-items: center;

      color: #8c5d44;

      position: relative;
    }


    /* =====================================================
       MAIN CONTAINER
    ===================================================== */

    .pic-container {

      position: relative;

      width:
        min(
          435px,
          100vw
        );

      height:
        min(
          700px,
          100vh
        );

      overflow: hidden;
    }


    /* =====================================================
       TITLE
    ===================================================== */

    .title {

      position: absolute;

      top: 15px;

      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(
          350px,
          calc(100% - 20px)
        );

      z-index: 200;

      display: flex;

      justify-content: center;
      align-items: center;

      pointer-events: none;
      user-select: none;
    }


    .title img {

      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;

      user-select: none;
      pointer-events: none;

      -webkit-user-drag: none;
    }


    /* =====================================================
       PHOTOBOOTH STAGE
    ===================================================== */

    .booth-stage {

      position: absolute;

      left: 50%;

      top:
        clamp(
          125px,
          20vh,
          145px
        );

      width:
        min(
          435px,
          100vw
        );

      height: 520px;

      transform:
        translateX(-50%);

      overflow: visible;
    }


    /* =====================================================
       PHOTOBOOTH
    ===================================================== */

    .photobooth {

      position: absolute;

      left: 50%;
      top: 0;

      width: 100%;
      height: auto;

      display: block;

      transform:
        translateX(-50%);

      z-index: 20;

      user-select: none;
      pointer-events: none;
    }


    /* =====================================================
       PAPER
    ===================================================== */

    .paper {

      position: absolute;

      left: 50%;

      /*
        เริ่มต้นอยู่ด้านในเครื่อง
      */

      top: 120px;

      width:
        min(
          245px,
          56.3%
        );

      height: auto;

      padding:
        10px
        10px
        18px;

      background: #fff;

      transform:
        translateX(-50%);

      opacity: 1;

      box-shadow:
        0 8px 25px
        rgba(
          0,
          0,
          0,
          .15
        );

      /*
        สำคัญ:
        ไม่มีการเลื่อนพร้อมกัน
      */

      transition:
        top 7s
        cubic-bezier(
          .20,
          .60,
          .25,
          1
        );
    }


    /* =====================================================
       ใบที่ 1
    ===================================================== */

    #paper1 {

      z-index: 101;
    }


    /* =====================================================
       ใบที่ 2

       ซ่อนอยู่ในเครื่องก่อน
       และจะเริ่ม animation ภายหลัง
    ===================================================== */

    #paper2 {

      z-index: 102;

      top: 120px;

      visibility: hidden;

      transition:
        top 7s
        cubic-bezier(
          .20,
          .60,
          .25,
          1
        );
    }


    /* =====================================================
       SHOW ใบที่ 1
    ===================================================== */

    #paper1.show {

      top: 180px;
    }


    /* =====================================================
       SHOW ใบที่ 2
    ===================================================== */

    #paper2.show {

      top: 180px;

      visibility: visible;
    }


    /* =====================================================
       MEMORY PHOTO
    ===================================================== */

    .memory-photo {

      display: block;

      width: 100%;
      height: auto;

      aspect-ratio:
        2 / 3;

      object-fit: contain;

      margin: 0;
      padding: 0;

      border: 0;

      user-select: none;

      pointer-events: auto;

      cursor: pointer;

      -webkit-user-drag: none;
    }


    /* =====================================================
       NAVIGATION
    ===================================================== */

    .navigation {

      position: absolute;

      left: 50%;
      bottom: 15px;

      transform:
        translateX(-50%);

      width: 100%;

      display: flex;

      justify-content: center;
      align-items: center;

      z-index: 300;

      padding: 0 10px;
    }


    /* =====================================================
       BACK BUTTON
    ===================================================== */

    .nav-btn {

      display: block;

      width: 145px;
      height: auto;

      padding: 0;
      margin: 0;

      border: none;
      border-radius: 0;

      background: transparent;

      box-shadow: none;

      text-decoration: none;

      cursor: pointer;

      line-height: 0;

      user-select: none;

      -webkit-user-drag: none;

      transition:
        transform .2s ease;
    }


    .nav-btn img {

      display: block;

      width: 100%;
      height: auto;

      border: none;

      user-select: none;
      pointer-events: none;

      -webkit-user-drag: none;
    }


    .nav-btn:hover {

      transform:
        translateY(-2px);
    }


    .nav-btn:active {

      transform:
        scale(.96);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 500px) {

      .pic-container {

        width: 100vw;

        height: 100vh;
      }


      .title {

        top: 15px;

        width:
          min(
            350px,
            calc(100% - 20px)
          );
      }


      .booth-stage {

        width: 100vw;

        height: 500px;

        top: 135px;
      }


      .photobooth {

        width: 100vw;

        max-width: 435px;
      }


      .paper {

        width:
          min(
            58vw,
            245px
          );

        top: 120px;

        padding:
          8px
          8px
          15px;
      }


      #paper1.show {

        top: 180px;
      }


      #paper2.show {

        top: 180px;
      }


      .navigation {

        bottom: 35px;
      }


      .nav-btn {

        width:
          min(
            145px,
            45vw
          );
      }

    }


    /* =====================================================
       SMALL MOBILE
    ===================================================== */

    @media (max-width: 380px) {

      .title {

        top: 12px;

        width:
          min(
            320px,
            calc(100% - 20px)
          );
      }


      .booth-stage {

        top: 128px;

        height: 470px;
      }


      .photobooth {

        width: 100vw;
      }


      .paper {

        width:
          min(
            58vw,
            230px
          );

        top: 115px;

        padding:
          7px
          7px
          13px;
      }


      #paper1.show,
      #paper2.show {

        top: 175px;
      }


      .navigation {

        bottom: 35px;
      }


      .nav-btn {

        width:
          min(
            135px,
            43vw
          );
      }

    }


    /* =====================================================
       VERY SMALL MOBILE
    ===================================================== */

    @media (max-width: 340px) {

      .title {

        top: 10px;

        width:
          min(
            290px,
            calc(100% - 20px
          );
      }


      .booth-stage {

        top: 120px;
      }


      .paper {

        width: 58vw;

        top: 110px;
      }


      #paper1.show,
      #paper2.show {

        top: 170px;
      }


      .navigation {

        bottom: 32px;
      }


      .nav-btn {

        width:
          min(
            130px,
            43vw
          );
      }

    }


    /* =====================================================
       SHORT SCREEN
    ===================================================== */

    @media (max-height: 700px) {

      .title {

        top: 8px;
      }


      .booth-stage {

        top: 100px;

        height: 430px;
      }


      .photobooth {

        width:
          min(
            435px,
            100vw
          );
      }


      .paper {

        top: 105px;
      }


      #paper1.show,
      #paper2.show {

        top: 165px;
      }


      .navigation {

        bottom: 30px;
      }

    }


    /* =====================================================
       VERY SHORT SCREEN
    ===================================================== */

    @media (max-height: 600px) {

      .title {

        top: 4px;

        width:
          min(
            300px,
            calc(100% - 20px)
          );
      }


      .booth-stage {

        top: 78px;

        height: 360px;
      }


      .photobooth {

        width:
          min(
            380px,
            100vw
          );
      }


      .paper {

        width:
          min(
            215px,
            56%
          );

        top: 90px;
      }


      #paper1.show,
      #paper2.show {

        top: 150px;
      }


      .navigation {

        bottom: 25px;
      }


      .nav-btn {

        width: 125px;
      }

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media
      (min-width: 501px)
      and (max-width: 900px)
      and (min-height: 601px) {

      .pic-container {

        width:
          min(
            435px,
            88vw
          );

        height:
          min(
            700px,
            94vh
          );
      }


      .title {

        width:
          min(
            350px,
            calc(100% - 20px)
          );
      }


      .booth-stage {

        width:
          min(
            435px,
            88vw
          );

        top:
          min(
            145px,
            20vh
          );
      }


      .photobooth {

        width: 100%;
      }


      .paper {

        width:
          min(
            245px,
            56.3%
          );

        top: 120px;
      }


      #paper1.show,
      #paper2.show {

        top: 180px;
      }


      .navigation {

        bottom: 35px;
      }

    }


    /* =====================================================
       TABLET LANDSCAPE
    ===================================================== */

    @media
      (min-width: 700px)
      and (max-height: 600px) {

      .pic-container {

        width: 435px;

        height: 100vh;
      }


      .title {

        top: 4px;

        width: 300px;
      }


      .booth-stage {

        width: 360px;

        height: 350px;

        top: 70px;
      }


      .photobooth {

        width: 360px;
      }


      .paper {

        width: 205px;

        top: 82px;
      }


      #paper1.show,
      #paper2.show {

        top: 142px;
      }


      .navigation {

        bottom: 25px;
      }


      .nav-btn {

        width: 150px;
      }

    }


    /* =====================================================
       DESKTOP
    ===================================================== */

    @media (min-width: 1200px) {

      .pic-container {

        width: 435px;

        height: 700px;
      }


      .title {

        top: 15px;

        width: 350px;
      }


      .booth-stage {

        width: 435px;

        height: 520px;

        top: 145px;
      }


      .photobooth {

        width: 435px;
      }


      .paper {

        width: 245px;

        top: 120px;
      }


      #paper1.show,
      #paper2.show {

        top: 180px;
      }


      .navigation {

        bottom: 35px;
      }

    }


    /* =====================================================
       FULL PHOTO VIEW
    ===================================================== */

    .photo-lightbox {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      justify-content: center;
      align-items: center;

      width: 100vw;
      height: 100vh;

      padding: 15px;

      background:
        rgba(
          0,
          0,
          0,
          .90
        );

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }


    .photo-lightbox.show {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;
    }


    .photo-lightbox-image {

      display: block;

      width: auto;
      height: auto;

      max-width: 96vw;
      max-height: 94vh;

      object-fit: contain;

      margin: auto;

      padding: 0;

      border: 0;

      border-radius: 4px;

      box-shadow:
        0 10px 40px
        rgba(
          0,
          0,
          0,
          .40
        );

      transform:
        scale(.92);

      transition:
        transform .25s ease;

      user-select: none;

      -webkit-user-drag: none;
    }


    .photo-lightbox.show
    .photo-lightbox-image {

      transform:
        scale(1);
    }


    /* =====================================================
       CLOSE BUTTON
    ===================================================== */

    .photo-lightbox-close {

      position: absolute;

      top: 15px;
      right: 15px;

      width: 44px;
      height: 44px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background:
        rgba(
          255,
          255,
          255,
          .92
        );

      color: #3c3333;

      font-family: Arial, sans-serif;

      font-size: 30px;

      line-height: 44px;

      text-align: center;

      cursor: pointer;

      z-index: 2;

      box-shadow:
        0 4px 15px
        rgba(
          0,
          0,
          0,
          .20
        );

      transition:
        transform .2s ease;
    }


    .photo-lightbox-close:hover {

      transform:
        scale(1.06);
    }


    .photo-lightbox-close:active {

      transform:
        scale(.94);
    }


    /* =====================================================
       MOBILE PHOTO VIEW
    ===================================================== */

    @media (max-width: 500px) {

      .photo-lightbox {

        padding: 8px;
      }


      .photo-lightbox-image {

        max-width: 96vw;

        max-height: 90vh;
      }


      .photo-lightbox-close {

        top: 10px;
        right: 10px;

        width: 40px;
        height: 40px;

        font-size: 27px;

        line-height: 40px;
      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       MAIN
  ===================================================== -->

  <main class="pic-container">


    <!-- TITLE -->

    <div class="title">

      <img
        src="text3.png"
        alt=""
        draggable="false"
      >

    </div>


    <!-- ===================================================
         PHOTOBOOTH
    =================================================== -->

    <div class="booth-stage">


      <!-- =================================================
           ใบที่ 1 : photo.png
      ================================================= -->

      <div
        class="paper"
        id="paper1"
      >

        <img
          src="photo.png"
          class="memory-photo"
          id="memoryPhoto1"
          alt="ความทรงจำของเรา รูปที่ 1"
          draggable="false"
        >

      </div>


      <!-- =================================================
           ใบที่ 2 : photo1.png
      ================================================= -->

      <div
        class="paper"
        id="paper2"
      >

        <img
          src="photo1.png"
          class="memory-photo"
          id="memoryPhoto2"
          alt="ความทรงจำของเรา รูปที่ 2"
          draggable="false"
        >

      </div>


      <!-- PHOTOBOOTH -->

      <img
        src="photobooth.png"
        class="photobooth"
        alt="Photo Booth"
        draggable="false"
      >

    </div>


    <!-- ===================================================
         NAVIGATION
    =================================================== -->

    <div class="navigation">

      <a
        href="song.html"
        class="nav-btn"
        aria-label="ย้อนกลับ"
      >

        <img
          src="back.png"
          alt="ย้อนกลับ"
          draggable="false"
        >

      </a>

    </div>


  </main>


  <!-- =====================================================
       LIGHTBOX
    ===================================================== -->

  <div
    class="photo-lightbox"
    id="photoLightbox"
    aria-hidden="true"
  >

    <button
      class="photo-lightbox-close"
      id="photoLightboxClose"
      type="button"
      aria-label="ปิดรูป"
    >
      ×
    </button>


    <img
      src=""
      class="photo-lightbox-image"
      id="photoLightboxImage"
      alt="รูปเต็ม"
      draggable="false"
    >

  </div>


  <!-- =====================================================
       JAVASCRIPT
    ===================================================== -->

  <script>


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const paper1 =
      document.getElementById(
        "paper1"
      );

    const paper2 =
      document.getElementById(
        "paper2"
      );


    /* =====================================================
       ปริ้นทีละใบ

       0.8 วินาที
       → ใบที่ 1 เริ่มออก

       8.5 วินาที
       → ใบที่ 1 จบ
       → ใบที่ 2 เริ่มออก

       จึงไม่มีการซ้อนกัน
    ===================================================== */

    window.addEventListener(
      "load",
      function () {

        /* ใบที่ 1 */

        setTimeout(
          function () {

            paper1.classList.add(
              "show"
            );

          },
          800
        );


        /* ใบที่ 2 */

        setTimeout(
          function () {

            /*
              เอาใบแรกกลับเข้าเครื่องก่อน
              เพื่อให้ใบที่ 2 ออกมาแทนตำแหน่งเดิม
            */

            paper1.classList.remove(
              "show"
            );


            /*
              ทำให้ใบที่ 2 มองเห็น
            */

            paper2.style.visibility =
              "visible";


            /*
              เริ่มปริ้นใบที่ 2
            */

            paper2.classList.add(
              "show"
            );

          },
          8500
        );

      }
    );


    /* =====================================================
       LIGHTBOX
    ===================================================== */

    const memoryPhoto1 =
      document.getElementById(
        "memoryPhoto1"
      );

    const memoryPhoto2 =
      document.getElementById(
        "memoryPhoto2"
      );

    const photoLightbox =
      document.getElementById(
        "photoLightbox"
      );

    const photoLightboxClose =
      document.getElementById(
        "photoLightboxClose"
      );

    const photoLightboxImage =
      document.getElementById(
        "photoLightboxImage"
      );


    /* =====================================================
       OPEN PHOTO
    ===================================================== */

    function openPhotoLightbox(
      imageSource
    ) {

      photoLightboxImage.src =
        imageSource;

      photoLightbox.classList.add(
        "show"
      );

      photoLightbox.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow =
        "hidden";
    }


    /* =====================================================
       CLOSE PHOTO
    ===================================================== */

    function closePhotoLightbox() {

      photoLightbox.classList.remove(
        "show"
      );

      photoLightbox.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow =
        "";
    }


    /* =====================================================
       PHOTO 1
    ===================================================== */

    memoryPhoto1.addEventListener(
      "click",
      function () {

        openPhotoLightbox(
          "photo.png"
        );

      }
    );


    /* =====================================================
       PHOTO 2
    ===================================================== */

    memoryPhoto2.addEventListener(
      "click",
      function () {

        openPhotoLightbox(
          "photo1.png"
        );

      }
    );


    /* =====================================================
       CLOSE BUTTON
    ===================================================== */

    photoLightboxClose.addEventListener(
      "click",
      function () {

        closePhotoLightbox();

      }
    );


    /* =====================================================
       CLICK BACKGROUND
    ===================================================== */

    photoLightbox.addEventListener(
      "click",
      function (event) {

        if (
          event.target ===
          photoLightbox
        ) {

          closePhotoLightbox();

        }

      }
    );


    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Escape" &&
          photoLightbox.classList.contains(
            "show"
          )
        ) {

          closePhotoLightbox();

        }

      }
    );

  </script>

</body>

</html>
